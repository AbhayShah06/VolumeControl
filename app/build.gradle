plugins { id 'com.android.application' }
android {
    namespace 'com.abhayshah.volumecontrol'
    compileSdk 35
    defaultConfig {
        applicationId 'com.abhayshah.volumecontrol'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    def signingFile = System.getenv('VOLUMECONTROL_SIGNING_PROPERTIES')
    if (signingFile) {
        def signing = new Properties()
        file(signingFile).withInputStream { signing.load(it) }
        signingConfigs {
            release {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.media3:media3-session:1.5.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
